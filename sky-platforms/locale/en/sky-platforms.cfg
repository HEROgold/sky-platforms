[mod-setting-description]
sky-platforms-kit-scale=Multiplies the solar panels, inserters, belts and platform foundations in the starting kit. Machines, labs and the damper are not scaled.
sky-platforms-spawn-radius=How many tiles from the hub new and respawned characters appear.

[sky-platforms]
kit-did-not-fit=Starting kit: __1__ of __2__ __3__ did not fit in the hub.
no-platform=There is no space platform to respawn on. You respawned by the vanilla rules.

[recipe-name]
sky-salvage-thruster=Salvage thruster
sky-metallic-crushing-copper=Metallic asteroid crushing (copper)
sky-oxide-crushing-stone=Oxide asteroid crushing (stone)

[recipe-description]
sky-salvage-thruster=A thruster at half the performance of the vanilla thruster, made without oil or chemical science.
sky-metallic-crushing-copper=Crushes a metallic asteroid chunk into copper ore. Yields less than the vanilla iron recipe.
sky-oxide-crushing-stone=Crushes an oxide asteroid chunk into stone. Yields less than the vanilla ice recipe.

